name: Build WTGWizard

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      upload-tag:
        type: string
        default: "Build-Artifacts"
      publish-artifact:
        type: boolean
        default: false
      main-version:
        type: string
        default: "1.0.0"
      worker-version:
        type: string
        default: "1.0.0"
      is-prerelease:
        type: boolean
        default: true
      architecture:
        type: string
        default: "x64"
      diagnostics:
        type: boolean
        default: false

permissions:
  contents: write

env:
  IS_PRERELEASE: ${{ inputs.is-prerelease }}
  UPLOAD_TAG: ${{ inputs.upload-tag }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # 版本去 v 由工作流处理（tag 如 v1.2.3-preview1 → 1.2.3-preview1）
      - name: Build artfacts
        shell: pwsh
        run: |
          $mainVer = "${{ inputs.main-version }}" -replace '^v',''
          $scriptArgs = @{
            Architecture = "${{ inputs.architecture }}"
            MainVer      = $mainVer
            WorkerVer    = "${{ inputs.worker-version }}"
            ZipTag       = "${{ env.UPLOAD_TAG }}"
          }
          if ("${{ inputs.diagnostics }}" -eq "true") {
            $scriptArgs["Diagnostics"] = $true
          }
          & ./BuildArtifacts.ps1 @scriptArgs

      - name: Upload artifacts
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v5
        with:
          name: WTGWizard-${{ env.UPLOAD_TAG }}
          path: build/WTGWizard-*.zip

      - name: Upload build diagnostics
        if: inputs.diagnostics
        uses: actions/upload-artifact@v5
        with:
          name: WTGWizard-Diagnostics-${{ env.UPLOAD_TAG }}
          path: build/BuildDiagnostics

      - name: Publish to GitHub Releases
        if: inputs.publish-artifact
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.IS_PRERELEASE }}
          files: build/WTGWizard-*.zip
          tag_name: ${{ env.UPLOAD_TAG }}
