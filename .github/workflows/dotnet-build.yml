name: Build WTGWizard

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      upload-tag:
        type: string
        default: "Build-Artifacts"
      main-version:
        type: string
        default: "1.0.0"
      worker-version:
        type: string
        default: "1.0.0"
      is-prerelease:
        type: boolean
        default: true
      architecture:
        type: string
        default: "x64"

env:
  IS_PRERELEASE: ${{ inputs.is-prerelease }}
  UPLOAD_TAG: ${{ inputs.upload-tag }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 版本去 v 由工作流处理（tag 如 v1.2.3-preview1 → 1.2.3-preview1）
      - name: Publish release build
        shell: pwsh
        run: |
          $mainVer = "${{ inputs.main-version }}" -replace '^v',''
          ./BuildArtifacts.ps1 -Architecture ${{ inputs.architecture }} `
            -MainVer $mainVer -WorkerVer ${{ inputs.worker-version }} `
            -ZipTag "${{ env.UPLOAD_TAG }}" -ZipDir build

      - name: Upload artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: WTGWizard-${{ env.UPLOAD_TAG }}
          path: build/WTGWizard-*.zip

      - name: Publish to GitHub Releases
        if: inputs.upload-artifact
        uses: softprops/action-gh-release@v1
        with:
          prerelease: ${{ env.IS_PRERELEASE }}
          files: build/WTGWizard-*.zip
          tag_name: ${{ env.UPLOAD_TAG }}
