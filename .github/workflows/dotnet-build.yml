name: Build WTGWizard

on:
  workflow_call:
    inputs:
      build-mode:
        type: string
        required: true
        description: "Build variant: FDD or SCD"
      upload-artifact:
        type: boolean
        default: true
      upload-tag:
        type: string
        default: "Build-Artifacts"
      main-version:
        type: string
        default: "1.0.0"
      worker-version:
        type: string
        default: "1.0.0"
      architecture:
        type: string
        default: "x64"
      diagnostics:
        type: boolean
        default: false

permissions:
  contents: write

env:
  UPLOAD_TAG: ${{ inputs.upload-tag }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # 版本去 v 由工作流处理（tag 如 v1.2.3-preview1 → 1.2.3-preview1）
      - name: Build artifacts (${{ inputs.build-mode }})
        shell: pwsh
        run: |
          $mainVer = "${{ inputs.main-version }}" -replace '^v',''
          $scriptArgs = @{
            BuildType    = "${{ inputs.build-mode }}"
            Architecture = "${{ inputs.architecture }}"
            MainVer      = $mainVer
            WorkerVer    = "${{ inputs.worker-version }}"
            ZipTag       = "${{ env.UPLOAD_TAG }}"
          }
          if ("${{ inputs.diagnostics }}" -eq "true") {
            $scriptArgs["Diagnostics"] = $true
          }
          & ./BuildArtifacts.ps1 @scriptArgs

      - name: Upload artifacts
        if: always() && inputs.upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: WTGWizard-${{ env.UPLOAD_TAG }}-${{ inputs.build-mode }}
          path: build/WTGWizard-*.zip
          if-no-files-found: warn

      - name: Upload build diagnostics
        if: always() && inputs.diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: WTGWizard-Diagnostics-${{ env.UPLOAD_TAG }}-${{ inputs.build-mode }}
          path: build/BuildDiagnostics
